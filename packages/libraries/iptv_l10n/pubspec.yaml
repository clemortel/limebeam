name: iptv_l10n
description: Shared FR/EN localizations for LimeBeam (single AppLocalizations).
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  # Only to map Failures → localized strings (one-way; core never imports l10n).
  iptv_core:
    path: ../iptv_core

flutter:
  generate: true
