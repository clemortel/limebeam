name: iptv_player
description: Playback abstraction. Exposes PlaybackController; wraps media_kit behind the boundary.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  dartz: ^0.10.1
  device_info_plus: ^13.2.0
  fast_immutable_collections: ^11.2.0
  flutter_riverpod: ^3.3.1
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  injectable: ^2.4.4
  iptv_cast:
    path: ../iptv_cast
  iptv_core:
    path: ../iptv_core
  iptv_l10n:
    path: ../iptv_l10n
  iptv_ui:
    path: ../iptv_ui
  # Engine lives behind the package boundary; screens never import it directly.
  media_kit: ^1.1.11
  media_kit_libs_video: ^1.0.5
  media_kit_video: ^2.0.1
  riverpod_annotation: ^4.0.2
  screen_brightness: ^2.1.0

dev_dependencies:
  build_runner: ^2.4.11
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  injectable_generator: ^2.6.2
  mockito: ^5.4.4
  riverpod_generator: ^4.0.3
