name: iptv_downloads
description: Offline episode downloads — queue, storage, and offline library.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  background_downloader: ^9.2.0
  dartz: ^0.10.1
  fast_immutable_collections: ^11.2.0
  flutter_riverpod: ^3.3.1
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  hive_flutter: ^1.1.0
  iptv_core:
    path: ../iptv_core
  iptv_l10n:
    path: ../iptv_l10n
  iptv_ui:
    path: ../iptv_ui
  json_annotation: ^4.9.0
  path_provider: ^2.1.4
  riverpod_annotation: ^4.0.2

dev_dependencies:
  build_runner: ^2.4.11
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.8.0
  mockito: ^5.4.4
  riverpod_generator: ^4.0.3
  riverpod: any
