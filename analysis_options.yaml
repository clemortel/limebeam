# Base analysis ruleset shared by every package in the monorepo.
# CI uses analysis_options.ci.yaml which tightens this to fatal-infos.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Explicit types are a project rule, not a suggestion.
    always_specify_types: warning
    # Magic numbers / helper-widget rules are enforced by the
    # flutter-architecture-enforcer agent, not the analyzer.
  exclude:
    - "**/*.freezed.dart"
    - "**/*.g.dart"
    - "**/*.gr.dart"
    - "**/*.config.dart"
    - "**/*.mocks.dart"

linter:
  rules:
    - always_declare_return_types
    - always_specify_types
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_final_in_for_each
    - require_trailing_commas
    - unawaited_futures
    - avoid_print
    - directives_ordering
