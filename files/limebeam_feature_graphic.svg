<svg width="1024" height="500" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>LimeBeam — Play Store feature graphic</title>
  <defs>
    <radialGradient id="glow" cx="0.2" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#C5F03A" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#C5F03A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="500" fill="#0B0C0E"/>
  <rect width="1024" height="500" fill="url(#glow)"/>

  <!-- The beam mark (source point + triangular beam + depth notch) -->
  <g transform="translate(19,35) scale(0.84)">
    <circle cx="156" cy="256" r="43" fill="#C5F03A"/>
    <path d="M184 235 L396 148 L396 364 L184 277 Z" fill="#C5F03A"/>
    <path d="M184 244 L338 198 L338 314 L184 268 Z" fill="#0B0C0E" opacity="0.16"/>
  </g>

  <!-- Wordmark: Lime (text) + Beam (accent) -->
  <text x="392" y="248" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="112" font-weight="700" letter-spacing="-2">
    <tspan fill="#F4F6F8">Lime</tspan><tspan fill="#C5F03A">Beam</tspan>
  </text>

  <!-- Tagline -->
  <text x="396" y="312" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="500" fill="#A7AEB6">Votre lecteur IPTV, en clair.</text>
</svg>
