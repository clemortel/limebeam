org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Built-in Kotlin ON: Flutter applies one KGP to the app and to plugins that
# bundle their own legacy KGP (package_info_plus/wakelock_plus/flutter_chrome_cast),
# fixing the multi-KGP cold-build conflict. app/build.gradle.kts must NOT also
# apply id("kotlin-android").
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Impeller renderer toggle → AndroidManifest EnableImpeller meta-data (via a
# manifest placeholder in app/build.gradle.kts). Default "true": avoids Skia's
# EGLImage raster cost on the Fire TV Stick PowerVR GE8300. Flip to "false" to
# A/B against Skia on real hardware (see tool/perf/README.md), then revert.
enableImpeller=true
